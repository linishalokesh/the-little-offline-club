
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eee9ff">
    <title>Catch the Stars | The Little Offline Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-wrapper">

        <header class="top-bar">
            <div class="club-name">
                <span class="club-icon">✦</span>
                THE LITTLE OFFLINE CLUB
            </div>
            <div class="game-number">ARCADE NO. 01</div>
        </header>

        <section class="welcome-screen" id="welcomeScreen">

            <div class="floating-star star-one">✦</div>
            <div class="floating-star star-two">✧</div>
            <div class="floating-star star-three">✦</div>

            <div class="welcome-content">

                <p class="eyebrow">A LITTLE GAME FOR YOU</p>

                <h1>Catch the <span>Stars</span></h1>

                <p class="subtitle">
                    A little adventure under the stars.
                </p>

                <div class="character-display">
                    <img src="assets/character.png" alt="Game character">
                </div>

                <div class="game-instructions">
                    <div class="instruction">
                        <span>⭐</span>
                        <p>Catch the stars</p>
                    </div>

                    <div class="instruction">
                        <span>🪨</span>
                        <p>Avoid the rocks</p>
                    </div>
                </div>

                <button id="startBtn" class="start-button">
                    Let's Play <span>→</span>
                </button>

                <p class="best-score">
                    PERSONAL BEST: <span id="welcomeBest">000</span>
                </p>

            </div>
        </section>

        <section class="game-screen hidden" id="gameScreen">

            <div class="game-hud">
                <div class="hud-item">
                    <span>SCORE</span>
                    <strong id="score">000</strong>
                </div>

                <div class="hud-item">
                    <span>TIME</span>
                    <strong id="timer">45</strong>
                </div>

                <div class="hud-item">
                    <span>LIVES</span>
                    <strong id="lives">♥ ♥ ♥</strong>
                </div>

                <button id="pauseBtn" class="pause-button">Ⅱ</button>
            </div>

            <canvas id="gameCanvas"></canvas>

            <div class="game-overlay hidden" id="pauseScreen">
                <h2>Take a little break</h2>
                <button id="resumeBtn">Resume</button>
                <button id="restartBtn">Restart</button>
            </div>

            <div class="game-overlay hidden" id="gameOverScreen">
                <h2>Game Over!</h2>
                <p>Your score: <span id="finalScore">0</span></p>
                <p id="newRecord"></p>
                <button id="playAgainBtn">Play Again</button>
            </div>

        </section>

        <footer class="footer">
            <span>MADE WITH A LITTLE MAGIC</span>
            <span>✦</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
